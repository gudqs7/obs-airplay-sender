name: Build Project

on:
  workflow_call:
    outputs:
      pluginName:
        description: Project name parsed from buildspec.json
        value: ${{ jobs.check-event.outputs.pluginName }}

jobs:
  check-event:
    name: Check GitHub Event Data
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    outputs:
      package: ${{ steps.setup.outputs.package }}
      config: ${{ steps.setup.outputs.config }}
      commitHash: ${{ steps.setup.outputs.commitHash }}
      pluginName: ${{ steps.setup.outputs.pluginName }}
      pluginVersion: ${{ steps.setup.outputs.pluginVersion }}
    steps:
      - uses: actions/checkout@v4
      - name: Read Build Settings
        id: setup
        run: |
          case "${GITHUB_EVENT_NAME}" in
            pull_request|workflow_dispatch)
              package=false
              config=RelWithDebInfo
              ;;
            push|schedule)
              package=true
              config=RelWithDebInfo
              ;;
            *)
              package=false
              config=RelWithDebInfo
              ;;
          esac

          echo "package=${package}" >> "${GITHUB_OUTPUT}"
          echo "config=${config}" >> "${GITHUB_OUTPUT}"
          echo "commitHash=${GITHUB_SHA:0:9}" >> "${GITHUB_OUTPUT}"
          echo "pluginName=$(jq -r '.displayName // .name' buildspec.json)" >> "${GITHUB_OUTPUT}"
          echo "pluginVersion=$(jq -r '.version' buildspec.json)" >> "${GITHUB_OUTPUT}"

  windows-build:
    name: Build for Windows x64
    runs-on: windows-2022
    needs: check-event
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Up Environment
        id: setup
        run: |
          $BuildSpec = Get-Content -Path buildspec.json -Raw | ConvertFrom-Json
          "pluginName=$($BuildSpec.name)" >> $env:GITHUB_OUTPUT
          "pluginVersion=$($BuildSpec.version)" >> $env:GITHUB_OUTPUT

      - name: Build Plugin
        uses: ./.github/actions/build-plugin
        with:
          target: x64
          config: ${{ needs.check-event.outputs.config }}

      - name: Package Plugin
        uses: ./.github/actions/package-plugin
        with:
          target: x64
          config: ${{ needs.check-event.outputs.config }}
          package: ${{ fromJSON(needs.check-event.outputs.package) }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-windows-x64-${{ needs.check-event.outputs.commitHash }}
          path: ${{ github.workspace }}/release/${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-windows-x64*.*
